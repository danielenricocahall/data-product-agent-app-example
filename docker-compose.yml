services:
  registry-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data-product-registry
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      MCP_SERVER_URL: "http://mcp-server:9000"
      REST_API_SERVER_URL: "http://rest-api-server:9001"
    depends_on:
      mcp-server:
        condition: service_healthy
      rest-api-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  registry-hydrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data-product-registry-hydrator
    command: ["uv", "run", "python", "-m", "data_product_agent_app_example.hydrate_registry"]
    environment:
      REGISTRY_API_URL: "http://registry-api:8000"
      MCP_SERVER_URL: "http://mcp-server:9000"
      REST_API_SERVER_URL: "http://rest-api-server:9001"
    depends_on:
      registry-api:
        condition: service_healthy
    restart: "no"

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mock-mcp-server
    command: ["uv", "run", "python", "-m", "data_product_agent_app_example.mcp_server"]
    environment:
      MCP_PORT: "9000"
    ports:
      - "9000:9000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  rest-api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lead-funnel-rest-api
    command: ["uv", "run", "python", "-m", "data_product_agent_app_example.rest_api_server"]
    environment:
      REST_API_PORT: "9001"
    ports:
      - "9001:9001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9001/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  agent-chat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data-product-agent-chat
    command:
      [
        "uv",
        "run",
        "python",
        "-m",
        "data_product_agent_app_example.chat_terminal",
        "--model",
        "gpt-4o",
        "--autoload-mcp-tools",
      ]
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      REGISTRY_API_URL: "http://registry-api:8000"
      MCP_SERVER_URL: "http://mcp-server:9000"
      REST_API_SERVER_URL: "http://rest-api-server:9001"
    depends_on:
      mcp-server:
        condition: service_healthy
      registry-api:
        condition: service_healthy
      registry-hydrator:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
    profiles: ["chat"]
